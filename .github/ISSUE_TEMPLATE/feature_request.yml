name: Suggest an improvement
description: Share a workflow or feature you would like Zhengming to improve.
title: "[Feature] "
body:
  - type: textarea
    id: scenario
    attributes:
      label: What are you trying to do?
      description: A specific situation helps explain where the experience could improve.
      placeholder: I want to share a match with friends, and currently...
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: How would you improve it?
      description: Describe the workflow, result, or a relevant example.
