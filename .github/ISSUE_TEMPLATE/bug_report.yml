name: Report a problem
description: Report a problem with startup, model connections, debates, or archives.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem in your own words. Screenshots and the original error text are helpful.
        Issues are public. Remove credentials, private conversations, and personal information before posting.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the actual result and the result you expected.
      placeholder: After starting a match, the page displayed...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps leading to the problem
      description: Describe the sequence where possible, including intermittent behavior.
      placeholder: Open the app → choose a lineup → start a match → ...
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include details you know. The diagnostic report includes the app version.
      placeholder: Windows 11, Edge, portable version 1.1.0-beta.2
  - type: input
    id: model
    attributes:
      label: Model and connection
      description: For API issues, include the provider, model ID, and protocol. For demos, enter scripted demo.
      placeholder: Provider name, model ID, OpenAI-compatible Chat Completions
  - type: textarea
    id: evidence
    attributes:
      label: Errors, screenshots, or diagnostics
      description: Paste the original error or attach screenshots after removing sensitive content.
